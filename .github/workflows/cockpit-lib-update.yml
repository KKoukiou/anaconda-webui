name: cockpit-lib-update
on:
  schedule:
    - cron: '0 2 * * 4'
  # can be run manually on https://github.com/rhinstaller/anaconda-webui/actions
  workflow_dispatch:
jobs:
  cockpit-lib-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      statuses: write
    steps:
      - name: Set up dependencies
        run: |
          sudo apt update
          sudo apt install -y make

      - name: Set up configuration and secrets
        run: |
          printf '[user]\n\tname = Cockpit Project\n\temail=cockpituous@gmail.com\n' > ~/.gitconfig
          echo '${{ secrets.GITHUB_TOKEN }}' > ~/.config/github-token

      - name: Clone repository
        uses: actions/checkout@v3

      - name: Run cockpit-lib-update
        run: |
          make bots
          bots/cockpit-lib-update

      - name: Sync cockpit npm dependency with Makefile
        run: |
          COMMIT=$(grep '^COCKPIT_REPO_COMMIT' Makefile | sed 's/COCKPIT_REPO_COMMIT *= *\([a-f0-9]*\).*/\1/')
          CURRENT=$(grep '"cockpit"' package.json | sed 's|.*archive/\([a-f0-9]*\)\.tar\.gz.*|\1|')
          if [ "$COMMIT" != "$CURRENT" ]; then
            sed -i "s|cockpit/archive/[a-f0-9]*\.tar\.gz|cockpit/archive/${COMMIT}.tar.gz|" package.json
            git add package.json
            git commit -m "package.json: Update cockpit dependency to ${COMMIT:0:12}"
            git push origin HEAD:cockpit-lib
          else
            echo "package.json already in sync"
          fi
